base_name: PM Operating System

tables:
  - name: Projects
    description: Proyectos gestionados por el PM Operating System.
    fields:
      - { name: Name, type: singleLineText }
      - { name: Project Code, type: singleLineText }
      - { name: Status, type: singleSelect, choices: [Discovery, Planned, In Progress, Blocked, Done, Archived] }
      - { name: Business Area, type: singleLineText }
      - { name: Owner, type: singleLineText }
      - { name: Team, type: singleLineText }
      - { name: Summary, type: multilineText }

  - name: Teams
    description: Equipos responsables o participantes.
    fields:
      - { name: Name, type: singleLineText }
      - { name: Lead, type: singleLineText }
      - { name: Area, type: singleLineText }
      - { name: Notes, type: multilineText }

  - name: Meetings
    description: Registro maestro de reuniones.
    fields:
      - { name: Meeting ID, type: singleLineText }
      - { name: Project, type: singleLineText }
      - { name: Team, type: singleLineText }
      - { name: Meeting Type, type: singleSelect, choices: [ASIS, TOBE, Follow-up, Planning, Decision, Risk, Other] }
      - { name: Meeting Date, type: dateTime }
      - { name: Participants, type: multilineText }
      - { name: Source, type: singleLineText }
      - { name: Notes, type: multilineText }

  - name: Transcripts
    description: Evidencia cruda e inmutable.
    fields:
      - { name: Transcript ID, type: singleLineText }
      - { name: Meeting ID, type: singleLineText }
      - { name: Project, type: singleLineText }
      - { name: Team, type: singleLineText }
      - { name: Raw Transcript, type: multilineText }
      - { name: Source URL, type: url }
      - { name: Immutable, type: checkbox }
      - { name: Imported At, type: dateTime }

  - name: Draft_Insights
    description: Capa temporal de trabajo iterativo.
    fields:
      - { name: Draft ID, type: singleLineText }
      - { name: Project, type: singleLineText }
      - { name: Meeting ID, type: singleLineText }
      - { name: Draft Type, type: singleSelect, choices: [Business Context, ASIS, TOBE, Capability, Feature, User Story, Risk, Decision, Summary, Open Question] }
      - { name: Title, type: singleLineText }
      - { name: Content, type: multilineText }
      - { name: Status, type: singleSelect, choices: [Draft, In Review, Approved Candidate, Rejected, Archived] }
      - { name: Version Hint, type: number }

  - name: Approved_Context
    description: Memoria oficial aprobada por el usuario.
    fields:
      - { name: Context ID, type: singleLineText }
      - { name: Project, type: singleLineText }
      - { name: Context Type, type: singleSelect, choices: [Business Context, ASIS, TOBE, Capability, Feature, User Story, Risk, Decision, Operating Rule] }
      - { name: Title, type: singleLineText }
      - { name: Approved Content, type: multilineText }
      - { name: Version, type: number }
      - { name: Status, type: singleSelect, choices: [Active, Superseded, Archived] }
      - { name: Source References, type: multilineText }
      - { name: Approved By, type: singleLineText }
      - { name: Approved At, type: dateTime }

  - name: OKRs
    description: OKRs y métricas por proyecto o equipo.
    fields:
      - { name: OKR ID, type: singleLineText }
      - { name: Project, type: singleLineText }
      - { name: Team, type: singleLineText }
      - { name: Objective, type: multilineText }
      - { name: Key Result, type: multilineText }
      - { name: Metric Name, type: singleLineText }
      - { name: Baseline, type: number }
      - { name: Target, type: number }
      - { name: Current Value, type: number }
      - { name: Due Date, type: dateTime }
      - { name: Status, type: singleSelect, choices: [On Track, At Risk, Off Track, Done] }

  - name: Capabilities
    description: Capacidades del mapa de impacto.
    fields:
      - { name: Capability ID, type: singleLineText }
      - { name: Project, type: singleLineText }
      - { name: Name, type: singleLineText }
      - { name: Description, type: multilineText }
      - { name: Priority, type: singleSelect, choices: [High, Medium, Low] }
      - { name: Status, type: singleSelect, choices: [Proposed, Approved, In Progress, Done, Dropped] }

  - name: Features
    description: Features derivadas de capacidades.
    fields:
      - { name: Feature ID, type: singleLineText }
      - { name: Project, type: singleLineText }
      - { name: Capability, type: singleLineText }
      - { name: Name, type: singleLineText }
      - { name: Description, type: multilineText }
      - { name: Priority, type: singleSelect, choices: [High, Medium, Low] }
      - { name: Status, type: singleSelect, choices: [Proposed, Approved, In Progress, Done, Dropped] }

  - name: User_Stories
    description: Historias de usuario o artefactos equivalentes.
    fields:
      - { name: Story ID, type: singleLineText }
      - { name: Project, type: singleLineText }
      - { name: Feature, type: singleLineText }
      - { name: Title, type: singleLineText }
      - { name: Narrative, type: multilineText }
      - { name: Acceptance Criteria, type: multilineText }
      - { name: Status, type: singleSelect, choices: [Draft, Approved, Planned, In Progress, Done, Dropped] }

  - name: Decisions
    description: Decisiones oficiales del proyecto.
    fields:
      - { name: Decision ID, type: singleLineText }
      - { name: Project, type: singleLineText }
      - { name: Title, type: singleLineText }
      - { name: Decision, type: multilineText }
      - { name: Rationale, type: multilineText }
      - { name: Decision Date, type: dateTime }
      - { name: Status, type: singleSelect, choices: [Active, Superseded, Rejected] }

  - name: Risks
    description: Riesgos identificados y seguimiento.
    fields:
      - { name: Risk ID, type: singleLineText }
      - { name: Project, type: singleLineText }
      - { name: Title, type: singleLineText }
      - { name: Description, type: multilineText }
      - { name: Impact, type: singleSelect, choices: [High, Medium, Low] }
      - { name: Probability, type: singleSelect, choices: [High, Medium, Low] }
      - { name: Mitigation, type: multilineText }
      - { name: Status, type: singleSelect, choices: [Open, Watching, Mitigated, Closed] }

  - name: Followups
    description: Compromisos y seguimiento operativo.
    fields:
      - { name: Followup ID, type: singleLineText }
      - { name: Project, type: singleLineText }
      - { name: Team, type: singleLineText }
      - { name: Title, type: singleLineText }
      - { name: Commitment, type: multilineText }
      - { name: Owner, type: singleLineText }
      - { name: Due Date, type: dateTime }
      - { name: Status, type: singleSelect, choices: [Open, In Progress, Done, Delayed, Cancelled] }

  - name: Milestones
    description: Hitos de entrega y control.
    fields:
      - { name: Milestone ID, type: singleLineText }
      - { name: Project, type: singleLineText }
      - { name: Name, type: singleLineText }
      - { name: Description, type: multilineText }
      - { name: Target Date, type: dateTime }
      - { name: Status, type: singleSelect, choices: [Upcoming, On Track, At Risk, Missed, Done] }
